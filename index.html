<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>毛建炟的个人网站</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.7;
        background: linear-gradient(120deg, #f6f9fc, #eef5ff);
        color: #1f2937;
      }
      .container {
        max-width: 760px;
        margin: 0 auto;
        padding: 3rem 1.25rem 4rem;
      }
      .card {
        background: rgba(255, 255, 255, 0.85);
        border-radius: 16px;
        padding: 2rem;
        box-shadow: 0 12px 30px rgba(31, 41, 55, 0.08);
      }
      h1,
      h2 {
        margin-top: 0;
      }
      .tag {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 0.875rem;
        margin-bottom: 1rem;
      }
      ul {
        padding-left: 1.2rem;
      }
      a {
        color: #2563eb;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      footer {
        margin-top: 2rem;
        font-size: 0.95rem;
        color: #4b5563;
      }
      @media (max-width: 520px) {
        .card {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <span class="tag">个人网站</span>
        <h1>你好，我是简大猫 👋</h1>
        <p>欢迎来到我的个人主页，这里会记录我的学习、项目和想法。</p>

        <h2>关于我</h2>
        <p>我喜欢编程和技术分享，正在持续学习前端、后端与 AI 相关知识。</p>

        <h2>最近在做</h2>
        <ul>
          <li>搭建个人网站并持续更新内容</li>
          <li>整理个人项目与技术笔记</li>
          <li>学习更好的工程化实践</li>
        </ul>

        <h2>联系方式</h2>
        <p>
          你可以通过
          <a href="jiandamao@gmail.com">hello@example.com</a>
          联系我。
        </p>

        <footer>© 2026 简大猫. All rights reserved.</footer>
      </section>
    </main>
  </body>
</html>
